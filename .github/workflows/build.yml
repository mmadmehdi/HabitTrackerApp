name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Local APK
        run: npx eas-cli build --platform android --profile preview --local --non-interactive
        env:
          EAS_NO_VCS: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: '*.apk'
